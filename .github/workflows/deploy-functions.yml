name: Desplegar Edge Functions de Supabase

# Se ejecuta automáticamente cada vez que hay un push a main que toca
# algo dentro de supabase/functions/ — así nunca hay que copiar y pegar
# código manualmente en el panel de Supabase.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {} # también se puede disparar a mano desde la pestaña Actions de GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Versión fijada en vez de "latest": con "latest" la Action
          # consulta la API de GitHub para resolver la versión más
          # reciente, y esa consulta sin autenticar tiene un límite bajo
          # de peticiones por hora que se agota fácil en runners
          # compartidos ("rate limit exceeded"). Fijar una versión evita
          # esa consulta por completo. Subir el número de vez en cuando
          # si se necesita una versión más nueva del CLI.
          version: 2.116.0

      - name: Deploy de todas las funciones
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
