<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="100%" stop-color="#203A43" />
    </linearGradient>
  </defs>

  <!-- Fondo opcional (oscuro elegante) -->
  <rect width="100%" height="100%" fill="#070D12" rx="12"/>

  <!-- Símbolo / Isotipo: Monograma abstracto 'L' + Columnas/Estructura -->
  <g transform="translate(30, 25)">
    <!-- Bloque izquierdo de la L -->
    <path d="M 10 10 L 30 10 L 30 80 L 75 80 L 75 100 L 10 100 Z" fill="url(#goldGradient)" />
    <!-- Acento tecnológico superior -->
    <rect x="45" y="30" width="15" height="15" rx="3" fill="#C5A059" opacity="0.4" />
  </g>

  <!-- Tipografía / Logotipo: LEGIUM -->
  <text x="135" y="92" font-family="'Inter', 'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#FFFFFF">
    LEGIUM
  </text>
  
  <!-- Slogan o Subtítulo: antes en font-size 12 / letter-spacing 6 sobre
       un lienzo de 150 de alto — a los tamaños normales de un logo de
       header (32-48px) el texto quedaba por debajo de 4px, ilegible.
       Se sube el tamaño y se reduce el espaciado entre letras para que
       siga siendo legible ahí sin agrandar todo el logotipo. -->
  <text x="138" y="122" font-family="'Inter', 'Montserrat', sans-serif" font-size="20" font-weight="500" letter-spacing="2" fill="#8C9BA5">
    LEGAL &amp; TECHNOLOGY
  </text>
</svg>
